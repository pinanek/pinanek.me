[workspace]
resolver = "3"
members = ["site"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
comfit = {
  version = "0.1.1",
  features = [
    "bash",
    "comment",
    "css",
    "dockerfile",
    "html",
    "javascript",
    "jsdoc",
    "json",
    "jsx",
    "markdown",
    "printf",
    "python",
    "regex",
    "render-html",
    "rust",
    "toml",
    "tsx",
    "typescript",
    "yaml",
  ]
}
comrak = { version = "0.54.0", default-features = false }
html-minifier = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
katex-rs = "0.3.0"
maud = "0.27.0"
rayon = "1.12.0"
resvg = { version = "0.47", default-features = false, features = ["raster-images", "text"] }
serde = { version = "1", features = ["derive"] }
slug = "0.1.6"
strum = { version = "0.28", features = ["derive"] }
thumbhash = "0.1.0"
toml = "1.1.8"
unicode-segmentation = "1.13.3"
url = "2.5"

[profile.dev]
opt-level = 0
debug = false
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 0
debug = false

[profile.release]
opt-level = 2
strip = "symbols"
lto = false
panic = "abort"
incremental = true
codegen-units = 32
